<h1>髪の装飾の重複・誤った紐づけを修復</h1><p>現在のPromptGeneratorの全データExportを選んでください。対象30枚の装飾設定だけを修復します。英語、注釈、NSFW、衣装データ、ほかの設定は保持します。外部へ送信しません。</p>

<p>元のExportをバックアップとして残し、保存したJSONを「全データ」Importしてください。Export後に編集した場合は、再度Exportからやり直してください。「追加」だけで再Importしても既存カードは更新されません。対象カードの手動編集した装飾設定も、この修正版に置き換わります。</p>

function repair(d){if(!d||!Array.isArray(d.folders)||!Array.isArray(d.words)||!Array.isArray(d.templates))throw Error('全データJSONを選んでください。');
const ids=new Set(d.templates.map(t=>t.id));let n=0;for(const w of d.words)if(Object.hasOwn(fixes,w.id)){if(fixes[w.id].some(id=>!ids.has(id)))throw Error('必要な髪の装飾がありません。先に髪データを追加してください。');w.templateIds=[...fixes[w.id]];n++;}
