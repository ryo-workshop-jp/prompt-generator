function merge(d){if(!d||!Array.isArray(d.folders)||!Array.isArray(d.words)||!Array.isArray(d.templates))throw Error('全データJSONを選んでください。');
if(!d.words.some(w=>w.id.startsWith('hg26_hair_v1')))throw Error('髪データが入った全データを選んでください。');
for(const key of ['folders','words','templates']){const ids=d[key].map(x=>x.id);if(new Set(ids).size!==ids.length)throw Error('IDが重複しています。処理を中止しました。');}
for(const key of ['folders','templates']){const ids=new Set(d[key].map(x=>x.id));for(const x of payload[key])if(!ids.has(x.id)){d[key].push(structuredClone(x));ids.add(x.id);}}
const ws=new Map(d.words.map(w=>[w.id,w]));let n=0,u=0;for(const w of payload.added)if(!ws.has(w.id)){const copy=structuredClone(w);d.words.push(copy);ws.set(copy.id,copy);n++;}
for(const update of payload.updates){const w=ws.get(update.id);if(w){Object.assign(w,structuredClone(update));u++;}}
const fs=new Set(['root',...d.folders.map(f=>f.id)]),ts=new Set(d.templates.map(t=>t.id));
for(const w of d.words.filter(w=>w.id.startsWith('hg26_hair_v1')))if(!fs.has(w.folderId)||(w.templateIds||[]).some(t=>!ts.has(t))||new Set(w.templateIds||[]).size!==(w.templateIds||[]).length)throw Error('髪の装飾参照に問題があります。保存せず終了しました。');
return {d,n,u};}
let result;const f=document.getElementById('file'),b=document.getElementById('save'),s=document.getElementById('status');
f.onchange=async()=>{b.disabled=true;result=null;try{const file=f.files[0];if(!file)return;const r=merge(JSON.parse(await file.text()));result=r.d;b.disabled=false;s.textContent='カード '+r.n+'枚追加、既存 '+r.u+'枚の設定を更新しました。';}catch(e){s.textContent=e.message;}};
b.onclick=()=>{if(!result)return;const u=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='promptgen-all-髪不足補完済み.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000);};
