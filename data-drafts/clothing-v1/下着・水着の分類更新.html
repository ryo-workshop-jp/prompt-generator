<!doctype html><html lang="ja"><meta charset="utf-8"><title>下着・水着の分類更新</title>
<style>body{font-family:system-ui;max-width:740px;margin:40px auto;padding:20px;line-height:1.8}button{padding:10px}#status{white-space:pre-wrap}</style>
<h1>下着・水着の分類更新</h1><p>現在の全データExportを選択してください。衣装第1案の下着・水着の分類だけを更新します。ファイルは外部送信しません。</p>
<input id="file" type="file" accept=".json"><button id="save" disabled>更新済み全データを保存</button><p id="status">ファイルを選んでください。</p>
<p>元のExportはバックアップとして残し、保存したファイルをPromptGeneratorの「全データ」からImportしてください。全データImportは現在のデータを置き換えます。Export後の編集を保つには、再度Exportからやり直してください。</p>
<script>
const configs=[{"id":"cg26_clothing_v1_f_swimadult","name":"露出の強い水着","parentId":"cg26_clothing_v1_f_swim","nsfw":true},{"id":"cg26_clothing_v1_f_underwear","name":"基本の下着","parentId":"cg26_clothing_v1_f_underwear_root","nsfw":false},{"id":"cg26_clothing_v1_f_underwear_root","name":"下着","parentId":"cg26_clothing_v1","nsfw":false},{"id":"cg26_clothing_v1_f_underwear_adult","name":"露出の強い下着","parentId":"cg26_clothing_v1_f_underwear_root","nsfw":true}];
let result;const f=document.getElementById('file'),b=document.getElementById('save'),s=document.getElementById('status');
f.onchange=async()=>{result=null;b.disabled=true;try{const file=f.files[0];if(!file)return;const d=JSON.parse(await file.text());if(!Array.isArray(d.folders)||!Array.isArray(d.words))throw Error('全データJSONを選んでください。');
if(d.folders.filter(x=>x.id==='cg26_clothing_v1_f_underwear').length!==1)throw Error('衣装第1案の下着フォルダが見つからないか、重複しています。');
for(const c of configs){const hits=d.folders.filter(x=>x.id===c.id);if(hits.length>1)throw Error('フォルダIDが重複しています。');if(hits.length)Object.assign(hits[0],c);else d.folders.push(c);}
const root=d.folders.find(x=>x.id==='cg26_clothing_v1');if(root&&root.parentId===null)root.parentId='root';
let n=0;for(const w of d.words){if(w.folderId==='cg26_clothing_v1_f_underwear'){w.nsfw=false;n++;}if(w.folderId==='cg26_clothing_v1_f_swimadult')w.nsfw=true;}
result=d;b.disabled=false;s.textContent='通常の下着 '+n+' 枚を通常表示へ変更。露出の強い水着フォルダをNSFWへ変更。露出の強い下着フォルダは空で用意しました。ほかのデータは保持します。';
}catch(e){s.textContent=e.message;}};
b.onclick=()=>{if(!result)return;const url=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='promptgen-all-下着水着分類更新済み.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);};
</script></html>
