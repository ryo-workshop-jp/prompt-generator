<!doctype html><html lang="ja"><meta charset="utf-8"><title>衣装名と状態を分離</title><style>body{font-family:system-ui;max-width:760px;margin:40px auto;padding:20px;line-height:1.8}button{padding:12px}</style>
<h1>衣装名と素材・状態・扱い方を分離</h1><p>現在の全データExportを選ぶと、マイクロブラとマイクロショーツの英語・注釈を衣装自体の説明へ更新し、素材・状態・扱い方8枚を追加します。NSFW設定やほかのカード、装飾、デッキ等は保持します。外部へ送信しません。</p>
<input id="file" type="file" accept=".json"><button id="save" disabled>更新済み全データを保存</button><p id="status">ファイルを選んでください。</p>
<p>元のExportをバックアップとして残し、保存したファイルを「全データ」Importしてください。Export後に編集した場合は再度Exportからやり直してください。対象2枚の手動編集した英語・注釈は新版に置き換わります。</p>
<script>
const payload={"folder":{"id":"cg26_clothing_v1_f_clothing_states","name":"衣装の素材・状態・扱い方","parentId":"cg26_clothing_v1","nsfw":false},"added":[{"id":"cg26_clothing_v1_w_clothing_state_opaque","folderId":"cg26_clothing_v1_f_clothing_states","label_jp":"不透明な生地","value_en":"opaque fabric","note":"透けない生地の指定。衣装の種類とは別に、必要なときだけ追加する。","nsfw":false},{"id":"cg26_clothing_v1_w_clothing_state_covered_nipples","folderId":"cg26_clothing_v1_f_clothing_states","label_jp":"乳首を覆った状態","value_en":"covered nipples","note":"衣装を着用し、乳首を覆う状態を指定する。持ち物や置かれた衣装には不要。","nsfw":false},{"id":"cg26_clothing_v1_w_clothing_state_covered_crotch","folderId":"cg26_clothing_v1_f_clothing_states","label_jp":"股部分を覆った状態","value_en":"covered crotch","note":"衣装を着用し、股部分を覆う状態を指定する。持ち物や置かれた衣装には不要。","nsfw":false},{"id":"cg26_clothing_v1_w_clothing_state_worn","folderId":"cg26_clothing_v1_f_clothing_states","label_jp":"衣装を着用する","value_en":"wearing clothes","note":"衣装を身につけた場面の指定。具体的な衣装カードと組み合わせる。","nsfw":false},{"id":"cg26_clothing_v1_w_clothing_state_hold","folderId":"cg26_clothing_v1_f_clothing_states","label_jp":"衣装を手に持つ","value_en":"holding clothing","note":"衣装を手に持つ場面の指定。着ている服ではなく持ち物として描きたいときに使う。","nsfw":false},{"id":"cg26_clothing_v1_w_clothing_state_table","folderId":"cg26_clothing_v1_f_clothing_states","label_jp":"衣装を机に置く","value_en":"clothing lying on a table","note":"衣装が机の上に置かれた場面の指定。人物に着用させる必要はない。","nsfw":false},{"id":"cg26_clothing_v1_w_clothing_state_hanger","folderId":"cg26_clothing_v1_f_clothing_states","label_jp":"衣装をハンガーに掛ける","value_en":"clothing on a hanger","note":"衣装をハンガーに掛けて見せる場面の指定。","nsfw":false},{"id":"cg26_clothing_v1_w_clothing_state_fold","folderId":"cg26_clothing_v1_f_clothing_states","label_jp":"衣装を畳んだ状態","value_en":"folded clothing","note":"衣装を畳んだ状態で描く指定。形の見え方は畳み方によって変わる。","nsfw":false}],"updates":[{"id":"cg26_clothing_v1_w_underwear_adult_microbra","value_en":"micro bra","note":"通常より胸を覆う布の面積が小さいブラ。着用のほか、持ち物や置かれた衣装としても使う。"},{"id":"cg26_clothing_v1_w_underwear_adult_micropanties","value_en":"micro panties","note":"通常より腰まわりの布の面積が小さいショーツ。着用のほか、持ち物や置かれた衣装としても使う。"}]};
function merge(d){if(!d||!Array.isArray(d.folders)||!Array.isArray(d.words))throw Error('全データJSONを選んでください。');
if(!d.folders.some(f=>f.id===payload.folder.parentId))throw Error('衣装第1案の親フォルダが見つかりません。');
for(const key of ['folders','words']){const ids=d[key].map(x=>x.id);if(new Set(ids).size!==ids.length)throw Error('重複IDがあります。変更を中止します。');}
if(!d.folders.some(f=>f.id===payload.folder.id))d.folders.push(structuredClone(payload.folder));
const ws=new Map(d.words.map(w=>[w.id,w]));let u=0,n=0;for(const x of payload.updates){const w=ws.get(x.id);if(w){w.value_en=x.value_en;w.note=x.note;u++;}}
for(const w of payload.added)if(!ws.has(w.id)){const copy=structuredClone(w);d.words.push(copy);ws.set(copy.id,copy);n++;}
return {d,u,n};}
let result;const f=document.getElementById('file'),b=document.getElementById('save'),s=document.getElementById('status');
f.onchange=async()=>{b.disabled=true;result=null;try{const file=f.files[0];if(!file)return;const r=merge(JSON.parse(await file.text()));result=r.d;b.disabled=false;s.textContent='衣装名 '+r.u+'枚を更新、素材・状態・扱い方 '+r.n+'枚を追加しました。';}catch(e){s.textContent=e.message;}};
b.onclick=()=>{if(!result)return;const u=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='promptgen-all-衣装状態分離済み.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000);};
</script></html>
