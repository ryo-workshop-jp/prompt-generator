function merge(d){if(!d||!Array.isArray(d.folders)||!Array.isArray(d.words)||!Array.isArray(d.templates))throw Error('PromptGeneratorの全データJSONを選んでください。');
for(const key of ['folders','words','templates']){const ids=d[key].map(x=>x.id);if(new Set(ids).size!==ids.length)throw Error('IDが重複しています。変更を中止しました。');}
const fs=new Map(d.folders.map(x=>[x.id,x]));for(const f of payload.folders)if(!fs.has(f.id)){const copy=structuredClone(f);d.folders.push(copy);fs.set(copy.id,copy);}
fs.get('cg26_clothing_v1_f_underwear_adult').nsfw=true;
const ts=new Set(d.templates.map(t=>t.id));for(const t of payload.templates)if(!ts.has(t.id)){d.templates.push(structuredClone(t));ts.add(t.id);}
const ws=new Set(d.words.map(w=>w.id));let n=0;for(const w of payload.words)if(!ws.has(w.id)){d.words.push(structuredClone(w));ws.add(w.id);n++;}
return {d,n};}
let result;const f=document.getElementById('file'),b=document.getElementById('save'),s=document.getElementById('status');
