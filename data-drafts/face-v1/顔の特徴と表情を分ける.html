<!doctype html><html lang="ja"><meta charset="utf-8"><title>顔の特徴と表情を分ける</title><style>body{font-family:system-ui;max-width:760px;margin:40px auto;padding:20px;line-height:1.8}button{padding:12px}</style>
<h1>顔の特徴と表情・視線を分ける</h1><p>現在の全データExportを選んでください。目・眉などを「顔の特徴」、まぶた・口・感情などを「表情・視線」へ整理します。英語、注釈、装飾、衣装・髪は変更しません。外部へ送信しません。</p>
<input id="file" type="file" accept=".json"><button id="save" disabled>再分類した全データを保存</button><p id="status">ファイルを選んでください。</p>
<p>元のExportをバックアップとして残し、保存したJSONを「全データ」Importしてください。Export後に編集した場合は再度Exportからやり直してください。対象フォルダの手動で編集した名前・親設定はこの分類へ更新します。</p>
<script>
const payload={"folders":[{"id":"eg26_face_v1","name":"顔の特徴","parentId":"root","nsfw":false},{"id":"eg26_face_v1_f_eyes","name":"目の形","parentId":"eg26_face_v1","nsfw":false},{"id":"eg26_face_v1_f_eye_states","name":"目・まぶたの状態","parentId":"eg26_face_v1_expressions","nsfw":false},{"id":"eg26_face_v1_f_eye_details","name":"瞳・まつげ","parentId":"eg26_face_v1","nsfw":false},{"id":"eg26_face_v1_f_eyebrows","name":"眉の形","parentId":"eg26_face_v1","nsfw":false},{"id":"eg26_face_v1_f_mouth","name":"口の状態","parentId":"eg26_face_v1_expressions","nsfw":false},{"id":"eg26_face_v1_f_smile","name":"笑顔","parentId":"eg26_face_v1_expressions","nsfw":false},{"id":"eg26_face_v1_f_emotions","name":"感情・表情","parentId":"eg26_face_v1_expressions","nsfw":false},{"id":"eg26_face_v1_f_gaze","name":"視線","parentId":"eg26_face_v1_expressions","nsfw":false},{"id":"eg26_face_v1_f_changes","name":"赤面・涙・顔の変化","parentId":"eg26_face_v1_expressions","nsfw":false},{"id":"eg26_face_v1_f_comic","name":"漫画的な表情","parentId":"eg26_face_v1_expressions","nsfw":false},{"id":"eg26_face_v1_expressions","name":"表情・視線","parentId":"root","nsfw":false},{"id":"eg26_face_v1_f_eyebrow_states","name":"眉の動き","parentId":"eg26_face_v1_expressions","nsfw":false},{"id":"eg26_face_v1_f_eye_expressions","name":"目の表情・漫画表現","parentId":"eg26_face_v1_expressions","nsfw":false}],"updates":[{"id":"eg26_face_v1_w_eyes_010","folderId":"eg26_face_v1_f_eye_states"},{"id":"eg26_face_v1_w_eyes_011","folderId":"eg26_face_v1_f_eye_states"},{"id":"eg26_face_v1_w_eyes_012","folderId":"eg26_face_v1_f_eye_states"},{"id":"eg26_face_v1_w_eye_details_002","folderId":"eg26_face_v1_f_eye_states"},{"id":"eg26_face_v1_w_eye_details_003","folderId":"eg26_face_v1_f_eye_states"},{"id":"eg26_face_v1_w_eye_details_008","folderId":"eg26_face_v1_f_eye_expressions"},{"id":"eg26_face_v1_w_eye_details_009","folderId":"eg26_face_v1_f_eye_expressions"},{"id":"eg26_face_v1_w_eye_details_010","folderId":"eg26_face_v1_f_eye_expressions"},{"id":"eg26_face_v1_w_eye_details_011","folderId":"eg26_face_v1_f_eye_expressions"},{"id":"eg26_face_v1_w_eye_details_012","folderId":"eg26_face_v1_f_eye_expressions"},{"id":"eg26_face_v1_w_eyebrows_006","folderId":"eg26_face_v1_f_eyebrow_states"},{"id":"eg26_face_v1_w_eyebrows_007","folderId":"eg26_face_v1_f_eyebrow_states"},{"id":"eg26_face_v1_w_eyebrows_008","folderId":"eg26_face_v1_f_eyebrow_states"}]};
function merge(d){if(!d||!Array.isArray(d.words)||!Array.isArray(d.folders))throw Error('全データJSONを選んでください。');if(!d.folders.some(f=>f.id==='eg26_face_v1'))throw Error('目・表情・視線データが見つかりません。');
const fs=new Map(d.folders.map(f=>[f.id,f]));for(const f of payload.folders){const prev=fs.get(f.id);if(prev){prev.name=f.name;prev.parentId=f.parentId;}else{const copy=structuredClone(f);d.folders.push(copy);fs.set(copy.id,copy);}}
let n=0;for(const u of payload.updates){const w=d.words.find(w=>w.id===u.id);if(w){w.folderId=u.folderId;n++;}}return {d,n};}
let result;const f=document.getElementById('file'),b=document.getElementById('save'),s=document.getElementById('status');
f.onchange=async()=>{b.disabled=true;result=null;try{const file=f.files[0];if(!file)return;const r=merge(JSON.parse(await file.text()));result=r.d;b.disabled=false;s.textContent='フォルダを整理し、'+r.n+'枚の所属フォルダを更新しました。';}catch(e){s.textContent=e.message;}};
b.onclick=()=>{if(!result)return;const u=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='promptgen-all-顔の特徴と表情に分離.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000);};
</script></html>
