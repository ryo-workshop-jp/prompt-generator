function mergeCategories(current,selected){
const clone=x=>JSON.parse(JSON.stringify(x));const norm=x=>String(x||'').trim().toLowerCase().replace(/\s+/g,' ');
if(!current||typeof current!=='object'||!Array.isArray(current.folders)||!Array.isArray(current.words))throw Error('PromptGeneratorからExportした全データJSONを選んでください。');
const result=clone(current);if(result.templates===undefined)result.templates=[];if(!Array.isArray(result.templates))throw Error('装飾データの形式が正しくありません。');
for(const key of ['folders','words','templates']){const ids=result[key].map(x=>x.id);if(ids.some(x=>typeof x!=='string'||!x)||new Set(ids).size!==ids.length)throw Error('既存の'+key+'にIDの不足または重複があります。');}
const counts={folders:0,words:0,templates:0,skipId:0,skipPrompt:0,links:0};const maps=Object.fromEntries(['folders','words','templates'].map(k=>[k,new Map(result[k].map(x=>[x.id,x]))]));const prompts=new Set(result.words.map(w=>norm(w.value_en)));
for(const data of selected){for(const key of ['folders','templates','words'])for(const item of data[key]){if(maps[key].has(item.id)){if(key==='words'){counts.skipId++;const existing=maps.words.get(item.id);if(norm(existing.value_en)===norm(item.value_en)&&existing.folderId===item.folderId){const oldIds=existing.templateIds||[];const added=(item.templateIds||[]).filter(t=>!oldIds.includes(t));if(added.length){existing.templateIds=[...oldIds,...added];counts.links+=added.length;}}}continue;}if(key==='words'&&prompts.has(norm(item.value_en))){counts.skipPrompt++;continue;}const copy=clone(item);result[key].push(copy);maps[key].set(copy.id,copy);counts[key]++;if(key==='words')prompts.add(norm(copy.value_en));}}
const folderIds=new Set(['root',...result.folders.map(f=>f.id)]),templateIds=new Set(result.templates.map(t=>t.id));
for(const data of selected)for(const item of data.words){const w=maps.words.get(item.id);if(w&&(!folderIds.has(w.folderId)||(w.templateIds||[]).some(t=>!templateIds.has(t))))throw Error('追加カードのフォルダまたは装飾の参照先が不足しています。');}
for(const data of selected)for(const f of data.folders)if(!folderIds.has(f.parentId))throw Error('追加フォルダの親が不足しています。');
return {result,counts};
}

let current=null,prepared=null;
const status=document.getElementById('status'),save=document.getElementById('save');
function refresh(){prepared=null;save.disabled=true;if(!current)return;try{const selected=[...document.querySelectorAll('.category:checked')].map(x=>categories[Number(x.value)][1]);if(!selected.length)throw Error('追加するカテゴリを選んでください。');const merged=mergeCategories(current,selected);prepared=merged.result;save.disabled=false;status.textContent='追加：'+merged.counts.words+'カード、'+merged.counts.folders+'フォルダ、'+merged.counts.templates+'装飾群\n既存IDで省略：'+merged.counts.skipId+'カード\n同じ英語で省略：'+merged.counts.skipPrompt+'カード\n補った装飾の紐付け：'+merged.counts.links+'件\n追加後：'+prepared.words.length+'カード';}catch(e){status.textContent=e.message;}}
document.getElementById('file').addEventListener('change',async e=>{current=null;prepared=null;save.disabled=true;try{const f=e.target.files[0];if(!f)return;current=JSON.parse(await f.text());refresh();}catch(e){status.textContent='読み込みエラー：'+e.message;}});
document.querySelectorAll('.category').forEach(x=>x.addEventListener('change',refresh));
save.addEventListener('click',()=>{if(!prepared)return;const url=URL.createObjectURL(new Blob([JSON.stringify(prepared,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='promptgen-all-背景ポーズ動作追加済み.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
